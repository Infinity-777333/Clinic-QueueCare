<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Reception Desk Login | Clinic QueueCare</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            padding: 1.25rem;
            width: 100%;
        }
        .login-card {
            background-color: #ffffff;
            border-radius: var(--radius-lg);
            max-width: 420px;
            width: 100%;
            padding: 1.75rem 1.5rem;
            box-shadow: var(--shadow-xl);
            min-width: 0;
        }
        @media (min-width: 480px) {
            .login-card {
                padding: 2.25rem;
            }
        }
        .login-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .login-header .icon {
            width: 54px;
            height: 54px;
            background-color: #d1fae5;
            color: #065f46;
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 2px 6px rgba(5, 150, 105, 0.2);
        }
        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition-fast);
            padding: 0.5rem;
        }
        .back-link:hover {
            color: var(--accent-emerald);
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div class="icon">&#128188;</div>
            <h2>Reception Desk</h2>
            <p>Front-desk patient booking and token coordination</p>
        </div>

        <div id="loginAlert" class="alert-box alert-danger" style="display: none;" role="alert"></div>

        <form id="receptionLoginForm" novalidate>
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    class="form-control" 
                    placeholder="Enter reception username" 
                    required 
                    autocomplete="username"
                    autocapitalize="none"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-control" 
                    placeholder="Enter password" 
                    required 
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="btnLogin" class="btn-primary" style="margin-top: 1.5rem; background-color: var(--accent-emerald);">
                <span>Sign In to Reception Desk</span> &rarr;
            </button>
        </form>

        <a href="index.html" class="back-link">&larr; Back to Patient Portal</a>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('receptionLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            const submitBtn = document.getElementById('btnLogin');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                alertBox.textContent = 'Please enter both username and password.';
                alertBox.style.display = 'flex';
                return;
            }

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Verifying credentials...</span>';

            try {
                const res = await fetch(`${API_BASE}/api/auth/reception/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (data.success) {
                    window.location.href = 'reception.html';
                } else {
                    alertBox.textContent = data.error || 'Authentication failed. Please check your credentials.';
                    alertBox.style.display = 'flex';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Sign In to Reception Desk</span> &rarr;';
                }
            } catch (err) {
                alertBox.textContent = 'Unable to connect to QueueCare server. Please ensure the backend is running.';
                alertBox.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In to Reception Desk</span> &rarr;';
            }
        });
    </script>
</body>
</html>
